# GitLab Pages: el job debe llamarse "pages" y publicar la carpeta public/.
# Se publica la carpeta docs/ tal cual (incluido docs/openapi.json, que está en el repositorio).
image: python:3.12-slim

stages: [test, deploy]

pruebas:
  stage: test
  script:
    - pip install -r requirements.txt
    - pytest

pages:
  stage: deploy
  script:
    - cp -r docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
